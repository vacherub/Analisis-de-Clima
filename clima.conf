# ============================================================
# Configuración de Analisis-de-Clima v2.3
# ============================================================
# Este archivo define las CIUDADES, sus COORDENADAS y su REGIÓN,
# y cuál es la ciudad POR DEFECTO.
#
# Incluye las 110 capitales de provincia de Italia. Puedes
# agregar cualquier otra ciudad como línea nueva.
#
# Formato por línea (una ciudad por línea):
#       NOMBRE;lat,lon;REGION
#       (lat y lon en grados decimales, con punto, ej. 45.07)
#       REGION es opcional: NOMBRE;lat,lon también vale.
#
# La ciudad por defecto es la única línea SIN '#' (sin comentar).
# Todas las demás deben ir comentadas con '#'.
#
# Para CAMBIAR la ciudad por defecto:
#   1) Quita el '#' delante de la ciudad que quieras activar.
#   2) Añade '#' delante de la que estaba activa.
#      (Deja solo UNA línea sin comentar.)
#
# Para AÑADIR una ciudad nueva, agrega una línea
#       CiudadNueva;lat,lon;Region
# por ejemplo:   BOLZANO;46.49,11.36;Trentino-Alto Adige
#
# Las coordenadas se pueden obtener de OpenStreetMap o cualquier
# fuente de geolocalización. El programa toma la ciudad por defecto
# y sus coordenadas de este archivo para consultar a Open-Meteo, y
# muestra "Ciudad (Región, coordenadas)" en sus reportes.
# ============================================================

