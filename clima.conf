# ============================================================
# Configuración de Analisis-de-Clima v2.0
# ============================================================
# Este archivo define las CIUDADES y sus COORDENADAS que el
# programa puede consultar, y cuál es la ciudad POR DEFECTO.
#
# Formato por línea (una ciudad por línea):
#       NOMBRE;lat,lon
#
# (consulta el final del archivo para un ejemplo real)
#
# La ciudad por defecto es la única línea SIN '#' (sin comentar).
# Todas las demás deben ir comentadas con '#'.
#
# Para CAMBIAR la ciudad por defecto:
#   1) Quita el '#' delante de la ciudad que quieras activar.
#   2) Añade '#' delante de la que estaba activa.
#      (Deja solo UNA línea sin comentar.)
#
# Para AÑADIR una ciudad nueva, agrega una línea
#       CiudadNueva;lat,lon
# por ejemplo:   BOLZANO;46.49,11.36
#
# Las coordenadas se pueden obtener de OpenStreetMap o cualquier
# fuente de geolocalización. El programa toma la ciudad por defecto
# y sus coordenadas de este archivo para consultar a Open-Meteo.
# ============================================================

